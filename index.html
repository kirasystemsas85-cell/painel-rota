<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Painel de Rota — Manutenção CFTV/Alarme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#10151b;--panel:#1a2129;--panel-alt:#212a33;--border:#2c3742;
    --text:#e7ebef;--text-dim:#8b96a3;--text-faint:#5c6672;
    --amber:#f0a94e;--green:#35d399;--red:#f2555f;--radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  input,textarea,select{font-family:'Inter',sans-serif;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--amber);}
  label{font-size:12px;color:var(--text-dim);display:block;margin:0 0 4px 2px;}
  ::placeholder{color:var(--text-faint);}

  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0%, #16202a 0%, var(--bg) 60%);}
  .auth-wrap::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 4.5s linear infinite;opacity:.55;}
  @keyframes sweep{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:28px 26px 24px;position:relative;z-index:1;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);}
  .auth-led{width:9px;height:9px;border-radius:50%;background:var(--amber);display:inline-block;margin-right:8px;box-shadow:0 0 8px var(--amber);animation:blink 2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
  .auth-title{font-size:19px;font-weight:600;margin:0 0 2px;}
  .auth-sub{color:var(--text-dim);font-size:13px;margin:0 0 22px;}
  .field-gap{margin-bottom:14px;}
  .btn-primary{background:var(--amber);color:#1a1206;font-weight:600;font-size:14px;padding:11px 16px;border-radius:8px;width:100%;}
  .auth-error{color:var(--red);font-size:13px;margin:-6px 0 14px;}

  .topbar{border-bottom:1px solid var(--border);background:var(--panel);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .brand-dot{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
  .brand-name{font-weight:700;font-size:15px;}
  .brand-sub{font-size:11px;color:var(--text-faint);margin-top:1px;}
  .nav-tabs{display:flex;gap:6px;}
  .nav-tab{background:none;color:var(--text-dim);font-size:13px;padding:7px 12px;border-radius:7px;border:1px solid transparent;}
  .nav-tab.active{background:var(--panel-alt);color:var(--text);border-color:var(--border);}
  .topbar-spacer{flex:1;}
  .who{font-size:12px;color:var(--text-dim);margin-right:6px;}
  .who b{color:var(--text);}
  .logout-btn{background:none;color:var(--text-dim);font-size:13px;border:1px solid var(--border);padding:7px 12px;border-radius:7px;}

  .content{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%;}
  .banner{background:#2a2010;border:1px solid #5a4a2a;color:var(--amber);font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:14px;}

  .summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .summary-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .summary-num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;line-height:1;}
  .summary-label{font-size:11px;color:var(--text-dim);margin-top:5px;text-transform:uppercase;}

  .controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .search-input{max-width:280px;}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .tab{background:none;color:var(--text-dim);font-size:12.5px;padding:7px 12px;border-radius:6px;}
  .tab.active{background:var(--panel-alt);color:var(--text);}
  .tab .cnt{opacity:.6;margin-left:4px;}
  .spacer-flex{flex:1;}
  .btn-add{background:var(--amber);color:#1a1206;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:8px;white-space:nowrap;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .unit-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 15px 13px;display:flex;flex-direction:column;gap:8px;}
  .unit-card.st-problema{border-color:#5a2a2f;}
  .unit-card.st-em_rota{border-color:#5a4a2a;}
  .unit-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .unit-name{font-weight:600;font-size:14.5px;line-height:1.3;}
  .unit-addr{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .led{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;}
  .led.ok{background:var(--green);box-shadow:0 0 6px var(--green);}
  .led.problema{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse-red 1.3s ease-in-out infinite;}
  .led.em_rota{background:var(--amber);box-shadow:0 0 6px var(--amber);}
  @keyframes pulse-red{0%,100%{opacity:1;}50%{opacity:.4;}}
  .status-pill{font-size:10.5px;padding:2px 8px;border-radius:20px;text-transform:uppercase;font-weight:600;width:fit-content;}
  .status-pill.ok{background:#123d2e;color:var(--green);}
  .status-pill.problema{background:#3d1418;color:var(--red);}
  .status-pill.em_rota{background:#3d2f14;color:var(--amber);}
  .assigned-pill{font-size:10.5px;padding:2px 8px;border-radius:20px;background:#132a3d;color:#5aa9e6;width:fit-content;}
  .unit-meta{font-size:11.5px;color:var(--text-faint);}
  .unit-actions{display:flex;gap:7px;margin-top:4px;}
  .btn-sm{flex:1;background:var(--panel-alt);color:var(--text);font-size:12.5px;padding:8px 8px;border-radius:7px;border:1px solid var(--border);text-align:center;}
  .btn-sm.route{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600;}
  .empty-state{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-dim);}
  .empty-state .display{font-size:16px;color:var(--text);margin-bottom:6px;}

  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back-btn{background:none;color:var(--text-dim);font-size:13px;border:1px solid var(--border);padding:7px 12px;border-radius:7px;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .detail-title{font-size:21px;font-weight:700;}
  .detail-addr{color:var(--text-dim);font-size:13px;margin-top:4px;}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--text);font-size:13px;padding:9px 14px;border-radius:8px;}
  .btn-danger-outline{background:none;border:1px solid #5a2a2f;color:var(--red);font-size:13px;padding:9px 14px;border-radius:8px;}

  .panel-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .panel-box h3{font-size:13px;text-transform:uppercase;color:var(--text-dim);margin:0 0 12px;font-weight:600;}
  .kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px;}
  .kv-item .kv-label{font-size:11px;color:var(--text-faint);margin-bottom:2px;}
  .kv-item .kv-val{font-size:13.5px;}
  .kv-empty{color:var(--text-faint);font-style:italic;}

  .cam-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .cam-row:last-child{border-bottom:none;}
  .cam-name{flex:1;font-size:13.5px;}
  .cam-toggle{display:flex;gap:4px;background:var(--panel-alt);border-radius:7px;padding:3px;}
  .cam-toggle button{font-size:11.5px;padding:5px 10px;border-radius:5px;background:none;color:var(--text-dim);}
  .cam-toggle button.active.ok{background:#123d2e;color:var(--green);}
  .cam-toggle button.active.problema{background:#3d1418;color:var(--red);}
  .cam-del{background:none;color:var(--text-faint);font-size:16px;padding:2px 6px;}
  .add-cam-row{display:flex;gap:8px;margin-top:10px;}
  .add-cam-row input{flex:1;}
  .btn-mini{background:var(--panel-alt);border:1px solid var(--border);color:var(--text);font-size:13px;padding:9px 13px;border-radius:8px;white-space:nowrap;}

  .hist-entry{padding:10px 0;border-bottom:1px solid var(--border);}
  .hist-entry:last-child{border-bottom:none;}
  .hist-date{font-size:11px;color:var(--text-faint);margin-bottom:3px;}
  .hist-date b{color:var(--text-dim);}
  .hist-text{font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
  .hist-tag{font-size:9.5px;text-transform:uppercase;padding:1px 6px;border-radius:10px;background:var(--panel-alt);color:var(--text-dim);margin-left:6px;}
  .hist-add textarea{min-height:64px;resize:vertical;margin-bottom:8px;}
  .no-hist{color:var(--text-faint);font-size:13px;font-style:italic;}

  .modal-overlay{position:fixed;inset:0;background:rgba(6,9,12,.7);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
  .modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:560px;padding:22px 24px 20px;}
  .modal-title{font-size:17px;font-weight:700;margin:0 0 16px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-section{margin-bottom:16px;}
  .form-section-label{font-size:12px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;font-weight:600;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
  .btn-cancel{background:none;border:1px solid var(--border);color:var(--text-dim);font-size:13.5px;padding:10px 16px;border-radius:8px;}

  .report-row{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .report-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .report-unit{font-weight:600;font-size:14px;}
  .report-meta{font-size:11.5px;color:var(--text-faint);}
  .report-tech{font-size:12px;color:#5aa9e6;}
  .report-text{font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
  .report-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}

  @media (max-width:640px){
    .summary-row{grid-template-columns:repeat(2,1fr);}
    .form-row{grid-template-columns:1fr;}
    .content{padding:14px;}
    .kv-grid{grid-template-columns:1fr 1fr;}
  }

  /* ---------- RONDAS ---------- */
  .ronda-badge{font-size:10.5px;padding:2px 8px;border-radius:20px;text-transform:uppercase;font-weight:600;width:fit-content;}
  .ronda-badge.feito{background:#123d2e;color:var(--green);}
  .ronda-badge.pendente{background:var(--panel-alt);color:var(--text-faint);}
  .photo-thumb{width:100%;height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:var(--panel-alt);margin-bottom:8px;}
  .report-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;}
  .report-card-body{padding:12px 14px;}

  /* ---------- USUARIOS ---------- */
  .user-row{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .user-info .u-name{font-weight:600;font-size:14px;}
  .user-info .u-email{font-size:12px;color:var(--text-dim);}
  .user-tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
  .user-tag{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--panel-alt);color:var(--text-dim);text-transform:uppercase;}
  .user-tag.admin{background:#3d2f14;color:var(--amber);}
  .checkbox-row{display:flex;align-items:center;gap:8px;padding:8px 0;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;font-size:13.5px;color:var(--text);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://erudkobuwgzuiqikjzki.supabase.co";
  const SUPABASE_KEY = "sb_publishable_tB5nCjfLIhNynitU5EGAbQ_QAglnoHS";
  const SESSION_KEY = "cftv_session";
  const REFRESH_MS = 8000;

  let state = {
    screen: "loading",
    authError: "",
    session: null,       // {access_token, refresh_token, expires_at, user}
    profile: null,        // {id, nome, role, areas}
    units: [],
    rondas: [],
    rondaUnidadesLimited: [],
    rondaTab: "fazer",     // 'fazer' | 'relatorio'
    rondaSearch: "",
    usersList: [],
    appSettings: {tecnica_bloqueada:false, rondas_bloqueada:false, rh_bloqueada:false, endereco_base:"", empresa_nome:""},
    baseEnderecoDraft: null,
    empresaNomeDraft: null,
    presencas: [],
    osList: [],
    osMonthFilter: null,
    osDaUnidade: [],
    view: "unidades",     // 'unidades' | 'relatorio' | 'rondas' | 'usuarios'
    tecTab: "fila",         // 'fila' | 'minhas'  (technician sub-tab)
    filter: "todas",       // admin sub-tab
    currentUnitId: null,
    search: "",
    modal: null,
    banner: "",
    newCameraName: {},
    noteDraft: {},
    pdfBusy: false
  };

  let pollTimer = null;

  // ---------------- API LAYER ----------------
  async function authFetch(path, opts){
    opts = opts || {};
    const headers = Object.assign({
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json"
    }, opts.headers||{});
    if(state.session && state.session.access_token){
      headers["Authorization"] = "Bearer " + state.session.access_token;
    }
    let res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
    if(res.status === 401 && state.session && state.session.refresh_token){
      const ok = await refreshSession();
      if(ok){
        headers["Authorization"] = "Bearer " + state.session.access_token;
        res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
      }
    }
    return res;
  }

  async function loginWithPassword(email, password){
    const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: {"apikey": SUPABASE_KEY, "Content-Type": "application/json"},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || "Usuário ou senha incorretos.");
    return {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in*1000),
      user: data.user
    };
  }

  async function refreshSession(){
    try{
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: {"apikey": SUPABASE_KEY, "Content-Type": "application/json"},
        body: JSON.stringify({refresh_token: state.session.refresh_token})
      });
      const data = await res.json();
      if(!res.ok) return false;
      state.session = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in*1000),
        user: data.user
      };
      persistSession();
      return true;
    }catch(e){ return false; }
  }

  function persistSession(){
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify(state.session)); }catch(e){}
  }
  function loadSession(){
    try{
      const raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function clearSession(){
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  }

  async function fetchProfile(userId){
    const res = await authFetch("/rest/v1/profiles?id=eq." + userId + "&select=*");
    const data = await res.json();
    return data[0] || null;
  }

  async function fetchUnits(){
    const res = await authFetch("/rest/v1/unidades?select=*,cameras(*),historico(*),assigned:profiles(nome)&order=nome.asc");
    if(!res.ok) return [];
    const data = await res.json();
    data.forEach(u=>{
      u.historico.sort((a,b)=> new Date(b.criado_em)-new Date(a.criado_em));
      u.assigned_to_nome = u.assigned ? u.assigned.nome : null;
    });
    return data;
  }

  async function apiCreateUnit(payload){
    const res = await authFetch("/rest/v1/unidades", {method:"POST", headers:{"Prefer":"return=representation"}, body: JSON.stringify(payload)});
    const data = await res.json();
    return data[0];
  }
  async function apiUpdateUnit(id, payload){
    const res = await authFetch("/rest/v1/unidades?id=eq."+id, {method:"PATCH", headers:{"Prefer":"return=representation"}, body: JSON.stringify(payload)});
    const data = await res.json();
    return data[0];
  }
  async function apiDeleteUnit(id){
    await authFetch("/rest/v1/unidades?id=eq."+id, {method:"DELETE"});
  }
  async function apiClaimUnit(id, userId){
    const res = await authFetch("/rest/v1/unidades?id=eq."+id+"&assigned_to=is.null", {
      method:"PATCH", headers:{"Prefer":"return=representation"},
      body: JSON.stringify({assigned_to:userId, assigned_at:new Date().toISOString()})
    });
    const data = await res.json();
    return data.length>0;
  }
  async function apiReleaseUnit(id){
    await authFetch("/rest/v1/unidades?id=eq."+id, {
      method:"PATCH", headers:{"Prefer":"return=representation"},
      body: JSON.stringify({assigned_to:null, assigned_at:null})
    });
  }
  async function apiAddCamera(unidade_id, nome){
    await authFetch("/rest/v1/cameras", {method:"POST", body: JSON.stringify({unidade_id, nome, status:"ok"})});
  }
  async function apiUpdateCamera(id, status){
    await authFetch("/rest/v1/cameras?id=eq."+id, {method:"PATCH", body: JSON.stringify({status})});
  }
  async function apiDeleteCamera(id){
    await authFetch("/rest/v1/cameras?id=eq."+id, {method:"DELETE"});
  }
  async function apiSalvarOS(unidade_id, servico_texto, responsavel_nome, assinatura_tecnico, assinatura_responsavel, foto_path, video_path){
    const res = await authFetch("/rest/v1/ordens_servico", {method:"POST", headers:{"Prefer":"return=representation"}, body: JSON.stringify({
      unidade_id, tecnico_id: state.profile.id, tecnico_nome: state.profile.nome,
      servico_texto, responsavel_nome, assinatura_tecnico, assinatura_responsavel, foto_path, video_path
    })});
    const data = await res.json();
    return data[0];
  }

  async function apiAddHistorico(unidade_id, tipo, texto, ajudantes){
    await authFetch("/rest/v1/historico", {method:"POST", body: JSON.stringify({
      unidade_id, tecnico_id: state.profile.id, tecnico_nome: state.profile.nome, tipo, texto, ajudantes: ajudantes||null
    })});
  }

  async function fetchUnidadesParaRondas(){
    const res = await authFetch("/rest/v1/rpc/unidades_para_rondas", {method:"POST", body: JSON.stringify({})});
    if(!res.ok) return [];
    return await res.json();
  }
  function unitsForRondas(){
    return (isAdmin() || hasArea("tecnica")) ? state.units : state.rondaUnidadesLimited;
  }

  // ---- RONDAS ----
  async function fetchRondas(){
    const res = await authFetch("/rest/v1/rondas?select=*&order=criado_em.desc");
    if(!res.ok) return [];
    return await res.json();
  }
  async function apiUploadOsAnexo(file, unidadeId, prefixo){
    const partesNome = (file.name||"arquivo").split(".");
    const ext = partesNome.length>1 ? partesNome.pop() : (file.type.includes("video")?"mp4":"jpg");
    const path = unidadeId + "/" + prefixo + "_" + Date.now() + "_" + Math.random().toString(36).slice(2,7) + "." + ext;
    const res = await authFetch("/storage/v1/object/os-anexos/" + path, {
      method: "POST",
      headers: {"Content-Type": file.type || "application/octet-stream"},
      body: file
    });
    if(!res.ok){
      let detail = "HTTP " + res.status;
      try{ const d = await res.json(); detail = d.message || d.error || JSON.stringify(d); }catch(e){}
      throw new Error(detail);
    }
    return path;
  }

  async function gerarPdfOSBlob(os, unidade){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:"pt", format:"a4"});
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 40;
    let y = 50;

    doc.setFontSize(16);
    doc.text(state.appSettings.empresa_nome || "Empresa", margin, y);
    y += 16;
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(state.appSettings.endereco_base || "", margin, y);
    doc.setTextColor(0);
    y += 26;

    doc.setFontSize(13);
    doc.text("ORDEM DE SERVIÇO", margin, y);
    y += 22;

    doc.setFontSize(10);
    doc.text("Unidade: " + (unidade ? unidade.nome : "—"), margin, y); y += 14;
    doc.text("Endereço: " + (unidade && unidade.endereco ? unidade.endereco : "—"), margin, y); y += 14;
    doc.text("Técnico: " + (os.tecnico_nome || "—"), margin, y); y += 14;
    doc.text("Responsável pela unidade: " + (os.responsavel_nome || "—"), margin, y); y += 14;
    doc.text("Data: " + fmtDate(os.criado_em), margin, y); y += 20;

    doc.setFontSize(10);
    doc.text("Serviço executado:", margin, y); y += 14;
    const linhas = doc.splitTextToSize(os.servico_texto || "(sem descrição)", pageW - margin*2);
    doc.text(linhas, margin, y);
    y += linhas.length*13 + 12;

    if(os.foto_path){
      try{
        const dataUrl = await fetchOsAnexoBase64(os.foto_path);
        if(dataUrl){
          const imgW = pageW - margin*2;
          const imgH = imgW * 0.6;
          if(y + imgH > 740){ doc.addPage(); y = 50; }
          doc.setFontSize(9);
          doc.text("Foto do serviço:", margin, y); y += 10;
          doc.addImage(dataUrl, "JPEG", margin, y, imgW, imgH);
          y += imgH + 16;
        }
      }catch(e){}
    }
    if(os.video_path){
      if(y > 730){ doc.addPage(); y = 50; }
      doc.setFontSize(9);
      doc.setTextColor(120);
      doc.text("Vídeo anexado ao registro (não incluso neste PDF, disponível no sistema).", margin, y);
      doc.setTextColor(0);
      y += 22;
    }

    if(y > 650){ doc.addPage(); y = 60; }
    y += 14;
    doc.setFontSize(10);
    doc.text("Assinatura do técnico", margin, y);
    doc.text("Assinatura do responsável", pageW/2 + 10, y);
    y += 8;
    const sigW = pageW/2 - margin - 15;
    const sigH = 70;
    try{ if(os.assinatura_tecnico) doc.addImage(os.assinatura_tecnico, "PNG", margin, y, sigW, sigH); }catch(e){}
    try{ if(os.assinatura_responsavel) doc.addImage(os.assinatura_responsavel, "PNG", pageW/2 + 10, y, sigW, sigH); }catch(e){}

    const nomeArq = "OS-" + (unidade ? unidade.nome.replace(/[^a-zA-Z0-9]+/g,"-") : "unidade") + "-" + new Date(os.criado_em).toISOString().slice(0,10) + ".pdf";
    return {doc, nomeArquivo: nomeArq};
  }

  async function baixarPdfOS(os, unidade){
    const {doc, nomeArquivo} = await gerarPdfOSBlob(os, unidade);
    doc.save(nomeArquivo);
  }

  async function compartilharOuBaixarPdfOS(os, unidade){
    const {doc, nomeArquivo} = await gerarPdfOSBlob(os, unidade);
    const blob = doc.output("blob");
    try{
      const file = new File([blob], nomeArquivo, {type:"application/pdf"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({
          files:[file],
          title: "Ordem de Serviço",
          text: "Ordem de serviço" + (unidade?(" — "+unidade.nome):"")
        });
        return "compartilhado";
      }
    }catch(err){
      if(err && err.name === "AbortError") return "cancelado";
      // qualquer outra falha do compartilhamento -> cai para baixar normal
    }
    doc.save(nomeArquivo);
    return "baixado";
  }

  async function boot(){
    const s = loadSession();
    if(!s){ state.screen="login"; rerender(); return; }
    state.session = s;
    try{
      const profile = await fetchProfile(s.user.id);
      if(!profile){ state.authError="Sua conta não tem um perfil cadastrado. Peça ao administrador para te cadastrar."; state.screen="login"; clearSession(); state.session=null; rerender(); return; }
      if(profile.ativo === false){ state.authError="Seu acesso foi bloqueado pelo administrador."; state.screen="login"; clearSession(); state.session=null; rerender(); return; }
      state.profile = profile;
      state.units = await fetchUnits();
      if(hasArea("rondas")) state.rondas = await fetchRondas();
      if(hasArea("rondas") && !(isAdmin() || hasArea("tecnica"))) state.rondaUnidadesLimited = await fetchUnidadesParaRondas();
      state.appSettings = await fetchSettings();
      state.view = defaultViewFor();
      state.tecTab = "fila";
      state.screen = "app";
      rerender();
      startPolling();
    }catch(e){
      state.screen="login"; rerender();
    }
  }

  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async ()=>{
      if(!state.session || state.modal) return;
      try{
        const freshProfile = await fetchProfile(state.session.user.id);
        if(!freshProfile || freshProfile.ativo === false){
          clearInterval(pollTimer);
          clearSession();
          state.session=null; state.profile=null; state.units=[]; state.currentUnitId=null;
          state.authError = "Seu acesso foi bloqueado pelo administrador.";
          state.screen="login";
          rerender();
          return;
        }
        state.profile = freshProfile;
        state.units = await fetchUnits();
        if(hasArea("rondas")) state.rondas = await fetchRondas();
      if(hasArea("rondas") && !(isAdmin() || hasArea("tecnica"))) state.rondaUnidadesLimited = await fetchUnidadesParaRondas();
        state.appSettings = await fetchSettings();
        rerender();
      }catch(e){}
    }, REFRESH_MS);
  }

  function setupSignaturePad(canvas){
    if(!canvas || canvas.dataset.padReady==="1") return;
    canvas.dataset.padReady = "1";
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#111";
    let drawing = false, last = null;
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }
    canvas.addEventListener("pointerdown", e=>{
      drawing = true; last = pos(e);
      canvas.setPointerCapture(e.pointerId);
      canvas.dataset.assinado = "1";
    });
    canvas.addEventListener("pointermove", e=>{
      if(!drawing) return;
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last = p;
    });
    canvas.addEventListener("pointerup", ()=>{ drawing=false; });
    canvas.addEventListener("pointercancel", ()=>{ drawing=false; });
  }
  function limparAssinatura(canvas){
    if(!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    canvas.dataset.assinado = "0";
  }
  function restaurarAssinatura(canvas, dataUrl){
    if(!canvas || !dataUrl) return;
    const img = new Image();
    img.onload = ()=>{ canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height); };
    img.src = dataUrl;
    canvas.dataset.assinado = "1";
  }

  function parseUnidadesTexto(texto){
    const linhas = texto.split("\n").map(l=>l.trim()).filter(Boolean);
    return linhas.map((linha, idx)=>{
      const grupos = [...linha.matchAll(/\(([^)]*)\)/g)].map(m=>m[1].trim());
      if(grupos.length < 3){
        return {linha: idx+1, bruto: linha, erro: "Não encontrei os 3 grupos entre parênteses (nome), (endereço), (câmeras)."};
      }
      const nome = grupos[0];
      const endereco = grupos[1];
      const camSpec = grupos[2];
      let qtdCameras = 0;
      const range = camSpec.match(/(\d+)\s*a\s*(\d+)/i);
      if(range){
        qtdCameras = parseInt(range[2],10) - parseInt(range[1],10) + 1;
      }else{
        const num = camSpec.match(/(\d+)/);
        if(num) qtdCameras = parseInt(num[1],10);
      }
      if(!nome){
        return {linha: idx+1, bruto: linha, erro: "Nome da unidade veio vazio."};
      }
      if(!qtdCameras || qtdCameras<1 || qtdCameras>200){
        return {linha: idx+1, bruto: linha, erro: "Não entendi a quantidade de câmeras em \"" + camSpec + "\"."};
      }
      return {linha: idx+1, nome, endereco, qtdCameras};
    });
  }

  function copyTextToClipboard(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject)=>{
      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        ta.style.top = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if(ok) resolve(); else reject(new Error("copy failed"));
      }catch(e){ reject(e); }
    });
  }

      if(sigResp && sigResp.dataset.assinado==="1") state.modal.sigResponsavelDataUrl = sigResp.toDataURL("image/png");
    }
    const active = document.activeElement;
    let restore = null;
    if(active && active.id) restore = {id:active.id, start:active.selectionStart, end:active.selectionEnd};
    document.getElementById("app").innerHTML = render();
    bindEvents();
    if(restore){
      const el = document.getElementById(restore.id);
      if(el){ el.focus(); if(typeof restore.start==="number" && el.setSelectionRange){ try{ el.setSelectionRange(restore.start, restore.end); }catch(e){} } }
    }
  }

  function buildReportText(){
    const entries = [];
    state.units.forEach(u=>{
      u.historico.filter(h=>h.tipo==="conclusao" && isToday(h.criado_em)).forEach(h=>{
        entries.push({unidade:u.nome, tecnico:h.tecnico_nome||"—", ajudantes:h.ajudantes, texto:h.texto, data:h.criado_em});
      });
    });
    entries.sort((a,b)=> new Date(a.data)-new Date(b.data));

    // agrupa por técnico, na ordem de quem concluiu a primeira visita primeiro
    const grupos = [];
    const idx = {};
    entries.forEach(e=>{
      if(!(e.tecnico in idx)){ idx[e.tecnico] = grupos.length; grupos.push({tecnico:e.tecnico, itens:[]}); }
      grupos[idx[e.tecnico]].itens.push(e);
    });

    if(!grupos.length) return "Nenhuma visita concluída hoje ainda.";

    let txt = "";
    grupos.forEach((g, gi)=>{
      if(gi>0) txt += "\n";
      txt += "Técnico: " + g.tecnico + "\n\n";
      g.itens.forEach((e,i)=>{
        const ajud = e.ajudantes ? " (ajudante: " + e.ajudantes + ")" : "";
        txt += (i+1) + ". " + e.unidade + ajud + "\n" + (e.texto||"(sem descrição)") + "\n\n";
      });
    });
    return txt.trim() + "\n";
  }

  async function gerarPdfRondas(){
    const todayRondas = state.rondas.filter(r=>isToday(r.criado_em)).slice().sort((a,b)=> new Date(a.criado_em)-new Date(b.criado_em));
    if(!todayRondas.length) return;
    state.pdfBusy = true; rerender();
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:"pt", format:"a4"});
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 30;
      const cols = 2, rows = 2, perPage = cols*rows;
      const gapX = 16, gapY = 24;
      const cellW = (pageW - margin*2 - gapX*(cols-1)) / cols;
      const cellH = (pageH - margin*2 - gapY*(rows-1)) / rows;
      const rondaUnits = unitsForRondas();

      for(let i=0;i<todayRondas.length;i++){
        const r = todayRondas[i];
        const posNaPagina = i % perPage;
        if(i>0 && posNaPagina===0) doc.addPage();
        const col = posNaPagina % cols;
        const row = Math.floor(posNaPagina / cols);
        const x = margin + col*(cellW+gapX);
        const y = margin + row*(cellH+gapY);

        const u = rondaUnits.find(x2=>x2.id===r.unidade_id);
        doc.setFontSize(11);
        doc.setTextColor(0);
        doc.text(u ? u.nome : "Unidade removida", x, y+12, {maxWidth:cellW});
        doc.setFontSize(8);
        doc.setTextColor(120);
        doc.text(u && u.endereco ? u.endereco : "Sem endereço cadastrado", x, y+24, {maxWidth:cellW});
        doc.setTextColor(0);

        const dataUrl = await fetchFotoBase64(r.foto_path);
        if(dataUrl){
          const imgY = y + 32;
          const imgH = cellH - 36;
          doc.addImage(dataUrl, "JPEG", x, imgY, cellW, imgH);
        }
      }
      doc.save("relatorio-rondas-" + new Date().toISOString().slice(0,10) + ".pdf");
    }catch(e){
      state.banner = "Não foi possível gerar o PDF: " + e.message;
    }
    state.pdfBusy = false;
    rerender();
  }

    const meses = Object.keys(porMes).sort().reverse();
    if(!state.osMonthFilter || !porMes[state.osMonthFilter]){
      state.osMonthFilter = meses.length ? meses[0] : todayDateStr().slice(0,7);
    }
    const mesAtual = state.osMonthFilter;
    const doMes = (porMes[mesAtual]||[]).slice().sort((a,b)=> new Date(b.criado_em)-new Date(a.criado_em));

    const porDia = {};
    doMes.forEach(os=>{
      const dia = os.criado_em.slice(0,10);
      (porDia[dia] = porDia[dia]||[]).push(os);
    });
    const dias = Object.keys(porDia).sort().reverse();

    const diasHtml = dias.length ? dias.map(dia=>{
      const itens = porDia[dia].map(os=>{
        const u = state.units.find(x=>x.id===os.unidade_id);
        return `
        <div class="report-row">
          <div class="report-top"><span class="report-unit">${esc(u?u.nome:"Unidade removida")}</span><span class="report-meta">${fmtDate(os.criado_em)}</span></div>
          <div class="report-tech">${esc(os.tecnico_nome||"—")} · Responsável: ${esc(os.responsavel_nome||"—")}</div>
          <div class="report-text">${esc(os.servico_texto||"(sem descrição)")}</div>
          <div class="unit-actions" style="margin-top:8px;max-width:200px;"><button class="btn-sm route" data-action="baixar-pdf-os" data-id="${os.id}">Baixar / Enviar PDF</button></div>
        </div>`;
      }).join("");
      const dataFmt = new Date(dia+"T00:00:00").toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"});
      return `<h3 style="font-size:13px;color:var(--text-dim);text-transform:capitalize;margin:18px 0 8px;">${dataFmt}</h3>${itens}`;
    }).join("") : `<div class="empty-state"><div class="display">Nenhuma OS registrada neste mês</div></div>`;

    return `
    <div class="controls-row">
      <select id="os-mes-select" style="max-width:220px;">
        ${meses.length ? meses.map(m=>`<option value="${m}" ${m===mesAtual?"selected":""}>${formatMesLabel(m)}</option>`).join("") : `<option>${formatMesLabel(mesAtual)}</option>`}
      </select>
      <div class="spacer-flex"></div>
      <div style="font-size:12px;color:var(--text-faint);">${doMes.length} OS neste mês</div>
    </div>
    ${diasHtml}`;
  }

  // ---------------- EVENTS ----------------
  function bindEvents(){
    const app = document.getElementById("app");

    const loginForm = document.getElementById("login-form");
    if(loginForm) loginForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-pass").value;
      const btn = document.getElementById("login-submit");
      btn.disabled = true; btn.textContent = "Entrando...";
      try{
        state.session = await loginWithPassword(email, pass);
        persistSession();
        const profile = await fetchProfile(state.session.user.id);
        if(!profile){
          state.authError = "Sua conta não tem perfil cadastrado. Peça ao administrador.";
          state.session = null; clearSession();
          state.screen = "login"; rerender(); return;
        }
        if(profile.ativo === false){
          state.authError = "Seu acesso foi bloqueado pelo administrador.";
          state.session = null; clearSession();
          state.screen = "login"; rerender(); return;
        }
        state.profile = profile;
        state.units = await fetchUnits();
        if(hasArea("rondas")) state.rondas = await fetchRondas();
      if(hasArea("rondas") && !(isAdmin() || hasArea("tecnica"))) state.rondaUnidadesLimited = await fetchUnidadesParaRondas();
        state.appSettings = await fetchSettings();
        state.authError = "";
        state.view = defaultViewFor();
        state.screen = "app";
        rerender();
        startPolling();
      }catch(err){
        state.authError = err.message || "Não foi possível entrar.";
        rerender();
      }
    });

    const searchInput = document.getElementById("search-input");
    if(searchInput) searchInput.addEventListener("input", e=>{ state.search = e.target.value; rerender(); });

    const newCamInput = document.getElementById("new-cam-input");
    if(newCamInput) newCamInput.addEventListener("input", e=>{ state.newCameraName[state.currentUnitId] = e.target.value; });

    const noteInput = document.getElementById("note-input");
    if(noteInput) noteInput.addEventListener("input", e=>{ state.noteDraft[state.currentUnitId] = e.target.value; });

    const baseEnderecoInput = document.getElementById("base-endereco");
    if(baseEnderecoInput) baseEnderecoInput.addEventListener("input", e=>{ state.baseEnderecoDraft = e.target.value; });
    const empresaNomeInput = document.getElementById("empresa-nome");
    if(empresaNomeInput) empresaNomeInput.addEventListener("input", e=>{ state.empresaNomeDraft = e.target.value; });

    const rondaSearchInput = document.getElementById("ronda-search-input");
    if(rondaSearchInput) rondaSearchInput.addEventListener("input", e=>{ state.rondaSearch = e.target.value; rerender(); });

    const importTexto = document.getElementById("import-texto");
    if(importTexto) importTexto.addEventListener("input", e=>{ state.modal.texto = e.target.value; });

    const concludeText = document.getElementById("conclude-text");
    if(concludeText) concludeText.addEventListener("input", e=>{ state.modal.draftText = e.target.value; });

    const concludeAjudantes = document.getElementById("conclude-ajudantes");
    if(concludeAjudantes) concludeAjudantes.addEventListener("input", e=>{ state.modal.draftAjudantes = e.target.value; });

    const osServico = document.getElementById("os-servico");
    if(osServico) osServico.addEventListener("input", e=>{ state.modal.servico = e.target.value; });
    const osResponsavel = document.getElementById("os-responsavel");
    if(osResponsavel) osResponsavel.addEventListener("input", e=>{ state.modal.responsavel = e.target.value; });
    const sigTecEl = document.getElementById("sig-tecnico");
    const sigRespEl = document.getElementById("sig-responsavel");
    setupSignaturePad(sigTecEl);
    setupSignaturePad(sigRespEl);
    if(state.modal && state.modal.kind==="assinatura"){
      if(state.modal.sigTecnicoDataUrl) restaurarAssinatura(sigTecEl, state.modal.sigTecnicoDataUrl);
      if(state.modal.sigResponsavelDataUrl) restaurarAssinatura(sigRespEl, state.modal.sigResponsavelDataUrl);
    }

    const unitForm = document.getElementById("unit-form");
    if(unitForm){
      const fieldMap = [
        ["f-nome","nome"],["f-endereco","endereco"],
        ["f-dvr-modelo","dvr_modelo"],["f-dvr-ip","dvr_ip"],["f-dvr-usuario","dvr_usuario"],["f-dvr-senha","dvr_senha"],["f-dvr-portas","dvr_portas"],
        ["f-central-nome","central_nome"],["f-central-codigo","central_codigo"],["f-central-telefone","central_telefone"]
      ];
      fieldMap.forEach(([id,key])=>{
        const el = document.getElementById(id);
        if(el) el.addEventListener("input", ev=>{ state.modal.draft[key] = ev.target.value; });
      });
      unitForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const d = state.modal.draft;
      const payload = {
        nome: document.getElementById("f-nome").value.trim(),
        endereco: document.getElementById("f-endereco").value.trim(),
        dvr_modelo: document.getElementById("f-dvr-modelo").value.trim(),
        dvr_ip: document.getElementById("f-dvr-ip").value.trim(),
        dvr_usuario: document.getElementById("f-dvr-usuario").value.trim(),
        dvr_senha: document.getElementById("f-dvr-senha").value.trim(),
        dvr_portas: document.getElementById("f-dvr-portas").value.trim(),
        central_nome: document.getElementById("f-central-nome").value.trim(),
        central_codigo: document.getElementById("f-central-codigo").value.trim(),
        central_telefone: document.getElementById("f-central-telefone").value.trim(),
        atualizado_em: new Date().toISOString()
      };
      if(!payload.nome) return;
      if(state.modal.mode==="add"){
        await apiCreateUnit(payload);
      }else{
        await apiUpdateUnit(d.id, payload);
      }
      state.modal = null;
      await refreshUnits();
      });
    }

    const reportTa = document.getElementById("report-textarea");
    if(reportTa){ reportTa.focus(); reportTa.select(); }

    app.addEventListener("click", handleClick);
    app.addEventListener("change", handleFileChange);
  }

  async function handleFileChange(e){
    const tecToggle = e.target.closest("#block-tecnica");
    if(tecToggle){
      const val = tecToggle.checked;
      await apiUpdateSettings({tecnica_bloqueada: val});
      state.appSettings.tecnica_bloqueada = val;
      rerender();
      return;
    }
    const rondaToggle = e.target.closest("#block-rondas");
    if(rondaToggle){
      const val = rondaToggle.checked;
      await apiUpdateSettings({rondas_bloqueada: val});
      state.appSettings.rondas_bloqueada = val;
      rerender();
      return;
    }
    const rhToggle = e.target.closest("#block-rh");
    if(rhToggle){
      const val = rhToggle.checked;
      await apiUpdateSettings({rh_bloqueada: val});
      state.appSettings.rh_bloqueada = val;
      rerender();
      return;
    }
    const osMesSelect = e.target.closest("#os-mes-select");
    if(osMesSelect){
      state.osMonthFilter = osMesSelect.value;
      rerender();
      return;
    }
  }

  async function handleClick(e){
    const t = e.target.closest("[data-action]");
    if(!t){
      if(e.target.closest(".modal-overlay") && !e.target.closest("[data-stop]")){ state.modal=null; rerender(); }
      return;
    }
    const action = t.getAttribute("data-action");

    if(action==="logout"){
      clearSession();
      if(pollTimer) clearInterval(pollTimer);
      state.session=null; state.profile=null; state.units=[]; state.currentUnitId=null;
      state.screen="login"; rerender(); return;
    }

    if(action==="nav"){
      state.view=t.getAttribute("data-view"); state.currentUnitId=null;
      rerender();
      if(state.view==="usuarios"){
        fetchAllProfiles().then(list=>{ state.usersList = list; rerender(); });
      }
      if(state.view==="rondas"){
        fetchRondas().then(list=>{ state.rondas = list; rerender(); });
      }
      if(state.view==="rh"){
        fetchAllProfiles().then(list=>{ state.usersList = list; rerender(); });
        fetchPresencasHoje().then(list=>{ state.presencas = list; rerender(); });
      }
      if(state.view==="ordens"){
        fetchOrdensServico().then(list=>{ state.osList = list; rerender(); });
      }
      return;
    }
    if(action==="ronda-tab"){ state.rondaTab=t.getAttribute("data-tab"); rerender(); return; }
    if(action==="tirar-foto"){
      abrirCameraPara(t.getAttribute("data-id"));
      return;
    }
    if(action==="gerar-pdf-rondas"){ await gerarPdfRondas(); return; }
    if(action==="marcar-presenca"){
      const id = t.getAttribute("data-id");
      const status = t.getAttribute("data-status");
      await apiMarcarPresenca(id, status);
      state.presencas = await fetchPresencasHoje();
      rerender();
      return;
    }
    if(action==="baixar-pdf-os"){
      const id = t.getAttribute("data-id");
      const os = state.osList.find(x=>x.id===id) || state.osDaUnidade.find(x=>x.id===id);
      if(!os) return;
      const u = state.units.find(x=>x.id===os.unidade_id);
      const textoOriginal = t.textContent;
      t.disabled = true; t.textContent = "Gerando...";
      try{ await compartilharOuBaixarPdfOS(os, u); }catch(e){ alert("Não foi possível gerar o PDF: " + e.message); }
      t.disabled = false; t.textContent = textoOriginal;
      return;
    }
    if(action==="excluir-ronda"){
      if(confirm("Excluir esta foto do relatório de hoje? Não pode ser desfeito.")){
        await apiDeleteRonda(t.getAttribute("data-id"), t.getAttribute("data-foto"));
        await refreshRondas();
      }
      return;
    }

    if(action==="new-user"){
      state.modal = {kind:"user", mode:"add", draft:{nome:"",email:"",role:"user",areas:[]}};
      rerender(); return;
    }
    if(action==="edit-user"){
      const p = state.usersList.find(x=>x.id===t.getAttribute("data-id"));
      if(p) state.modal = {kind:"user", mode:"edit", draft: JSON.parse(JSON.stringify(p))};
      rerender(); return;
    }
    if(action==="remove-user"){
      if(confirm("Remover o acesso desta pessoa ao painel? O login continua existindo no Supabase.")){
        await apiDeleteProfile(t.getAttribute("data-id"));
        state.usersList = await fetchAllProfiles();
      }
      rerender(); return;
    }
    if(action==="toggle-user-ativo"){
      const id = t.getAttribute("data-id");
      const novoAtivo = t.getAttribute("data-val") === "1";
      await apiUpdateProfile(id, {ativo: novoAtivo});
      state.usersList = await fetchAllProfiles();
      rerender(); return;
    }
    if(action==="salvar-base"){
      const val = (state.baseEnderecoDraft!==null ? state.baseEnderecoDraft : (document.getElementById("base-endereco")?document.getElementById("base-endereco").value:"")).trim();
      const nomeEmpresa = (state.empresaNomeDraft!==null ? state.empresaNomeDraft : (document.getElementById("empresa-nome")?document.getElementById("empresa-nome").value:"")).trim();
      await apiUpdateSettings({endereco_base: val, empresa_nome: nomeEmpresa});
      state.appSettings.endereco_base = val;
      state.appSettings.empresa_nome = nomeEmpresa;
      state.baseEnderecoDraft = null;
      state.empresaNomeDraft = null;
      state.banner = "Dados da empresa salvos.";
      rerender();
      setTimeout(()=>{ state.banner=""; rerender(); }, 3000);
      return;
    }
    if(action==="save-user"){
      const nome = document.getElementById("u-nome").value.trim();
      const email = document.getElementById("u-email").value.trim();
      const senha = document.getElementById("u-senha") ? document.getElementById("u-senha").value : null;
      const role = document.getElementById("u-admin").checked ? "admin" : "user";
      const areas = [];
      if(document.getElementById("u-area-tecnica").checked) areas.push("tecnica");
      if(document.getElementById("u-area-rondas").checked) areas.push("rondas");
      if(document.getElementById("u-area-rh").checked) areas.push("rh");
      if(!nome || !email){ return; }
      try{
        if(state.modal.mode==="add"){
          if(!senha || senha.length<8){ state.banner="A senha temporária precisa ter pelo menos 8 caracteres."; rerender(); setTimeout(()=>{state.banner="";rerender();},4000); return; }
          const authUser = await apiSignupAuthUser(email, senha);
          await apiCreateProfile({id: authUser.id, nome, email, role, areas});
        }else{
          await apiUpdateProfile(state.modal.draft.id, {nome, role, areas});
        }
        state.modal = null;
        state.usersList = await fetchAllProfiles();
        rerender();
      }catch(err){
        state.banner = err.message || "Não foi possível salvar o usuário.";
        rerender();
        setTimeout(()=>{ state.banner=""; rerender(); }, 5000);
      }
      return;
    }
    if(action==="tec-tab"){ state.tecTab=t.getAttribute("data-tab"); rerender(); return; }
    if(action==="set-filter"){ state.filter=t.getAttribute("data-filter"); rerender(); return; }

    if(action==="new-unit"){
      state.modal={mode:"add", draft:{id:null,nome:"",endereco:"",dvr_modelo:"",dvr_ip:"",dvr_usuario:"",dvr_senha:"",dvr_portas:"",central_nome:"",central_codigo:"",central_telefone:""}};
      rerender(); return;
    }
    if(action==="open-import"){
      state.modal = {kind:"import", step:"input", texto:"", parsed:[], progress:""};
      rerender(); return;
    }
    if(action==="import-analisar"){
      const texto = document.getElementById("import-texto").value;
      state.modal.texto = texto;
      state.modal.parsed = parseUnidadesTexto(texto);
      state.modal.step = "preview";
      rerender(); return;
    }
    if(action==="import-voltar"){
      state.modal.step = "input";
      rerender(); return;
    }
    if(action==="import-criar"){
      const validos = state.modal.parsed.filter(p=>!p.erro);
      state.modal.step = "creating";
      let ok = 0, falhas = 0;
      for(let i=0;i<validos.length;i++){
        const item = validos[i];
        state.modal.progress = "Criando " + (i+1) + " de " + validos.length + ": " + item.nome;
        rerender();
        try{
          const novaUnidade = await apiCreateUnit({
            nome: item.nome, endereco: item.endereco||"",
            dvr_modelo:"", dvr_ip:"", dvr_usuario:"", dvr_senha:"", dvr_portas:"",
            central_nome:"", central_codigo:"", central_telefone:"",
            atualizado_em: new Date().toISOString()
          });
          for(let c=1;c<=item.qtdCameras;c++){
            await apiAddCamera(novaUnidade.id, "Câmera " + c);
          }
          ok++;
        }catch(err){ falhas++; }
      }
      state.modal.progress = ok + " unidade(s) criada(s) com sucesso." + (falhas?(" " + falhas + " falharam."):"");
      state.modal.step = "done";
      rerender();
      await refreshUnits();
      return;
    }
    if(action==="edit-unit"){
      const u = state.units.find(x=>x.id===t.getAttribute("data-id"));
      if(u) state.modal={mode:"edit", draft: JSON.parse(JSON.stringify(u))};
      rerender(); return;
    }
    if(action==="reselect-report"){
      const ta = document.getElementById("report-textarea");
      if(ta){ ta.focus(); ta.select(); }
      return;
    }
    if(action==="close-modal"){ state.modal=null; rerender(); return; }
    if(action==="modal-overlay"){ return; }

    if(action==="delete-unit"){
      if(confirm("Excluir esta unidade e todo o histórico? Não pode ser desfeito.")){
        await apiDeleteUnit(t.getAttribute("data-id"));
        state.currentUnitId=null;
        await refreshUnits();
      }
      return;
    }

    if(action==="open-unit"){
      state.currentUnitId=t.getAttribute("data-id");
      rerender();
      fetchOrdensServicoUnidade(state.currentUnitId).then(list=>{ state.osDaUnidade=list; rerender(); });
      return;
    }
    if(action==="back"){ state.currentUnitId=null; rerender(); return; }

    if(action==="route"){
      const u = state.units.find(x=>x.id===t.getAttribute("data-id"));
      if(u) openRouteFor(u);
      return;
    }
    if(action==="compartilhar-localizacao"){
      const u = state.units.find(x=>x.id===t.getAttribute("data-id"));
      if(u) compartilharLocalizacao(u);
      return;
    }
    if(action==="plano-rota"){ abrirPlanoDeRota(); return; }

    if(action==="claim"){
      const id = t.getAttribute("data-id");
      const ok = await apiClaimUnit(id, state.profile.id);
      if(!ok){
        state.banner = "Essa unidade já foi assumida por outro técnico.";
        setTimeout(()=>{ state.banner=""; rerender(); }, 4000);
      }else{
        await apiAddHistorico(id, "rota", "Técnico assumiu a unidade.");
        state.tecTab = "minhas";
      }
      await refreshUnits();
      return;
    }

    if(action==="release"){
      await apiReleaseUnit(t.getAttribute("data-id"));
      state.currentUnitId=null;
      await refreshUnits();
      return;
    }

    if(action==="open-conclude"){
      state.modal={kind:"conclude", unitId:t.getAttribute("data-id"), draftText:"", draftAjudantes:""};
      rerender(); return;
    }
    if(action==="abrir-assinatura"){
      state.modal={kind:"assinatura", unitId:t.getAttribute("data-id"), servico:"", responsavel:""};
      rerender(); return;
    }
    if(action==="limpar-assinatura"){
      limparAssinatura(document.getElementById(t.getAttribute("data-target")));
      return;
    }
    if(action==="anexar-foto-os"){ osFotoInput.value=""; osFotoInput.click(); return; }
    if(action==="anexar-video-os"){ osVideoInput.value=""; osVideoInput.click(); return; }
    if(action==="remover-anexo-os"){
      const tipo = t.getAttribute("data-tipo");
      if(tipo==="foto"){ state.modal.fotoFile=null; state.modal.fotoNome=null; }
      else{ state.modal.videoFile=null; state.modal.videoNome=null; }
      rerender(); return;
    }
    if(action==="salvar-os"){
      const canvasTec = document.getElementById("sig-tecnico");
      const canvasResp = document.getElementById("sig-responsavel");
      if(canvasTec.dataset.assinado!=="1" || canvasResp.dataset.assinado!=="1"){
        alert("As duas assinaturas (técnico e responsável) são necessárias antes de salvar.");
        return;
      }
      const responsavel = document.getElementById("os-responsavel").value.trim();
      if(!responsavel){
        alert("Informe o nome do responsável pela unidade.");
        return;
      }
      const unidadeId = t.getAttribute("data-id");
      const servico = document.getElementById("os-servico").value.trim();
      const assinaturaTecnico = canvasTec.toDataURL("image/png");
      const assinaturaResponsavel = canvasResp.toDataURL("image/png");
      const salvarBtn = t;
      salvarBtn.disabled = true;
      salvarBtn.textContent = "Salvando...";
      try{
        let fotoPath = null, videoPath = null;
        if(state.modal.fotoFile) fotoPath = await apiUploadOsAnexo(state.modal.fotoFile, unidadeId, "foto");
        if(state.modal.videoFile) videoPath = await apiUploadOsAnexo(state.modal.videoFile, unidadeId, "video");
        const osSalva = await apiSalvarOS(unidadeId, servico, responsavel, assinaturaTecnico, assinaturaResponsavel, fotoPath, videoPath);
        state.modal = null;
        state.banner = "Ordem de serviço salva! Preparando PDF...";
        rerender();
        const u = state.units.find(x=>x.id===unidadeId);
        const resultado = await compartilharOuBaixarPdfOS(osSalva, u);
        state.banner = resultado==="compartilhado" ? "OS salva e enviada!" : resultado==="baixado" ? "OS salva e PDF baixado! Envie pra quem precisar." : "OS salva!";
        rerender();
        setTimeout(()=>{ state.banner=""; rerender(); }, 4500);
      }catch(err){
        alert("Não foi possível salvar a OS: " + err.message);
        salvarBtn.disabled = false;
        salvarBtn.textContent = "Salvar OS assinada";
      }
      return;
    }

    if(action==="confirm-conclude"){
      const id = t.getAttribute("data-id");
      const text = (state.modal.draftText||"").trim() || "Manutenção realizada.";
      const ajudantes = (state.modal.draftAjudantes||"").trim();
      await apiAddHistorico(id, "conclusao", text, ajudantes);
      await apiReleaseUnit(id);
      state.modal=null;
      state.currentUnitId=null;
      await refreshUnits();
      return;
    }

    if(action==="cam-status"){
      const camId = t.getAttribute("data-cam");
      await apiUpdateCamera(camId, t.getAttribute("data-val"));
      await refreshUnits();
      return;
    }
    if(action==="cam-remove"){
      await apiDeleteCamera(t.getAttribute("data-cam"));
      await refreshUnits();
      return;
    }
    if(action==="add-camera"){
      const unitId = t.getAttribute("data-id");
      const name = (state.newCameraName[unitId]||"").trim();
      if(!name) return;
      await apiAddCamera(unitId, name);
      state.newCameraName[unitId] = "";
      await refreshUnits();
      return;
    }

    if(action==="add-nota"){
      const unitId = t.getAttribute("data-id");
      const text = (state.noteDraft[unitId]||"").trim();
      if(!text) return;
      await apiAddHistorico(unitId, "nota", text);
      state.noteDraft[unitId] = "";
      await refreshUnits();
      return;
    }

    if(action==="copy-report"){
      const txt = buildReportText();
      state.modal = {kind:"textview", title:"Relatório do dia", text: txt};
      rerender();
      copyTextToClipboard(txt).then(()=>{
        state.modal = null;
        state.banner = "Relatório copiado! Cole onde quiser enviar (WhatsApp, e-mail, etc.).";
        rerender();
        setTimeout(()=>{ state.banner=""; rerender(); }, 4000);
      }).catch(()=>{ /* modal já está aberto com o texto selecionado para copiar manualmente */ });
      return;
    }
    if(action==="copy-presenca"){
      const txt = buildPresencaText();
      state.modal = {kind:"textview", title:"Presença do dia", text: txt};
      rerender();
      copyTextToClipboard(txt).then(()=>{
        state.modal = null;
        state.banner = "Presença copiada! Cole onde quiser enviar (WhatsApp, e-mail, etc.).";
        rerender();
        setTimeout(()=>{ state.banner=""; rerender(); }, 4000);
      }).catch(()=>{ /* modal já está aberto com o texto selecionado para copiar manualmente */ });
      return;
    }
  }

  // Input de câmera único e permanente — nunca é recriado pelos re-renders,
  // por isso não se perde se o app atualizar a tela no meio de um upload
  // (ex: tirar foto de uma unidade e, logo em seguida, de outra).
  const cameraInput = document.createElement("input");
  cameraInput.type = "file";
  cameraInput.accept = "image/*";
  cameraInput.capture = "environment";
  cameraInput.style.display = "none";
  document.body.appendChild(cameraInput);

  function abrirCameraPara(unidadeId){
    cameraInput.value = "";
    cameraInput.dataset.unidadeId = unidadeId;
    cameraInput.click();
  }

  cameraInput.addEventListener("change", async ()=>{
    const unidadeId = cameraInput.dataset.unidadeId;
    const file = cameraInput.files && cameraInput.files[0];
    if(!file || !unidadeId) return;
    const unidade = state.units.find(u=>u.id===unidadeId) || state.rondaUnidadesLimited.find(u=>u.id===unidadeId);
    const nomeUnidade = unidade ? unidade.nome : "unidade";
    state.banner = "Enviando foto de " + nomeUnidade + "...";
    rerender();
    try{
      const path = await apiUploadFoto(file, unidadeId);
      await apiInsertRonda(unidadeId, path);
      state.banner = "Foto de " + nomeUnidade + " registrada!";
      await refreshRondas();
      setTimeout(()=>{ state.banner=""; rerender(); }, 3000);
    }catch(err){
      state.banner = "Não foi possível enviar a foto de " + nomeUnidade + ": " + err.message;
      rerender();
      setTimeout(()=>{ state.banner=""; rerender(); }, 8000);
    }
  });

  const osFotoInput = document.createElement("input");
  osFotoInput.type = "file";
  osFotoInput.accept = "image/*";
  osFotoInput.style.display = "none";
  document.body.appendChild(osFotoInput);
  osFotoInput.addEventListener("change", ()=>{
    const file = osFotoInput.files && osFotoInput.files[0];
    if(!file || !state.modal || state.modal.kind!=="assinatura") return;
    state.modal.fotoFile = file;
    state.modal.fotoNome = file.name;
    rerender();
  });

  const osVideoInput = document.createElement("input");
  osVideoInput.type = "file";
  osVideoInput.accept = "video/*";
  osVideoInput.style.display = "none";
  document.body.appendChild(osVideoInput);
  osVideoInput.addEventListener("change", ()=>{
    const file = osVideoInput.files && osVideoInput.files[0];
    if(!file || !state.modal || state.modal.kind!=="assinatura") return;
    state.modal.videoFile = file;
    state.modal.videoNome = file.name;
    rerender();
  });

  boot();
})();
</script>
</body>
</html>
